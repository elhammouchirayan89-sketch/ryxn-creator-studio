margin:0 auto;padding:32px clamp(16px,4vw,48px) 56px;border-top:1px solid #2A2D35;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;color:#9A9CA5;font-size:14px\">\n<span>© 2026 Ryxn Creator Studio<\u002Fspan>\n<span>Impressum und Datenschutz: [LINKS ERGÄNZEN]<\u002Fspan>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4000}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { i: 0 };\n  }\n  renderVals() {\n    const facts = [\n      { tag: 'Tierwelt', text: 'Ein Oktopus hat drei Herzen und blaues Blut.' },\n      { tag: 'Weltall', text: 'Auf der Venus dauert ein Tag länger als ein ganzes Jahr.' },\n      { tag: 'Natur', text: 'Botanisch gesehen sind Bananen Beeren, Erdbeeren dagegen nicht.' },\n      { tag: 'Tierwelt', text: 'Wombats produzieren würfelförmigen Kot.' },\n      { tag: 'Technik', text: 'Der Eiffelturm wird im Sommer durch die Hitze um mehrere Zentimeter höher.' }\n    ];\n    const i = (this.state && this.state.i) || 0;\n    const cur = facts[i % facts.length];\n    const bars = [];\n    for (let k = 0; k < 72; k++) {\n      const v = 18 + Math.abs(Math.sin(k * 1.7) * Math.cos(k * 0.45)) * 82;\n      bars.push({ h: Math.round(v) + '%' });\n    }\n    return {\n      bars: bars,\n      fact: { tag: cur.tag, text: cur.text, no: String(i % facts.length + 1).padStart(2, '0') },\n      nextFact: () => this.setState({ i: (i + 1) % facts.length }),\n      dots: facts.map((f, idx) => ({\n        label: 'Fakt ' + (idx + 1) + ' anzeigen',\n        bg: idx === i ? '#FF7A3D' : '#3A3D47',\n        pick: () => this.setState({ i: idx })\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
